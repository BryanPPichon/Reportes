<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reportes</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="container">
        <header>
            <h1>📊 Reportes</h1>
            <p class="subtitle"></p>
        </header>

        <main>
            <div class="stats-container"
                style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 40px;">
                <a class="stat-card today" href="gc.html" style="text-decoration: none; color: inherit;">
                    <div class="stat-content">
                        <h2>Gourmet Card</h2>
                    </div>
                </a>

                <a class="stat-card yesterday" href="registros_ayer.html"
                    style="text-decoration: none; color: inherit;">
                    <div class="stat-content">
                        <h2>La Joya</h2>
                    </div>
                </a>

                <a class="stat-card hotels" href="Galindo/index.html" style="text-decoration: none; color: inherit;">
                    <div class="stat-content">
                        <h2>Galindo</h2>
                    </div>
                </a>

                <a class="stat-card total" href="total_usuarios.html" style="text-decoration: none; color: inherit;">
                    <div class="stat-content">
                        <h2>Courtyard</h2>
                    </div>
                </a>

                <a class="stat-card total" href="total_usuarios.html" style="text-decoration: none; color: inherit;">
                    <div class="stat-content">
                        <h2>Chapultepec</h2>
                    </div>
                </a>

            </div>
        </main>

        <footer>
            <p>Plan de Lealtad - Gourmet Card</p>
        </footer>
    </div>
</body>

</html>
